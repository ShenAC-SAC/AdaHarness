name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install package
        run: uv sync --frozen --group dev

      - name: Run tests
        run: uv run pytest -q

      - name: Compile Python files
        run: uv run python -m compileall adaharness tests

      - name: Run lint
        run: uv run ruff check .

      - name: Build package
        run: uv build

      - name: Smoke test analyze CLI
        run: |
          mkdir -p runs
          uv run adaharness analyze \
            --traces examples/traces/overconstrained_harness.jsonl \
            --current-policy examples/policies/heavy_policy.json \
            --diagnostics-config examples/diagnostics/default.toml \
            --out runs/harness-drift.md
          test -f runs/harness-drift.md
          test -f runs/harness-drift.analysis.json
          test -f runs/harness-drift.metrics.json
          test -f runs/harness-drift.diagnosis.json
          test -f runs/harness-drift.policy-diff.json

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaharness"
version = "0.1.0"
description = "Adaptive harness selection and evaluation for LLM agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "AdaHarness contributors" }
]
keywords = ["llm", "agents", "harness", "evaluation", "benchmark"]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.40"]
local = ["requests>=2.31"]
all = ["openai>=1.0", "anthropic>=0.40", "requests>=2.31"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
adaharness = "adaharness.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

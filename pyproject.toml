[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaharness"
version = "0.1.0"
description = "Harness drift analyzer for LLM agent projects."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "AdaHarness contributors" }
]
keywords = ["llm", "agents", "harness", "trace", "drift", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/ShenAC-SAC/AdaHarness"
Repository = "https://github.com/ShenAC-SAC/AdaHarness"
Issues = "https://github.com/ShenAC-SAC/AdaHarness/issues"

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.40"]
local = ["requests>=2.31"]
all = ["openai>=1.0", "anthropic>=0.40", "requests>=2.31"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
adaharness = "adaharness.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
